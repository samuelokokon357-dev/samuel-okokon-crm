<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CRM Login | Samuel Okokon</title>

    <link rel="stylesheet" href="css/crm.css">
</head>

<body class="login-page">

    <main class="login-container">

        <section class="login-card">

            <div class="login-brand">

                <div class="brand-mark">
                    SO
                </div>

                <div>
                    <h1>Samuel Okokon</h1>
                    <p>Client Relationship Management</p>
                </div>

            </div>


            <div class="login-heading">

                <span class="eyebrow">
                    PRIVATE CRM
                </span>

                <h2>Welcome Back</h2>

                <p>
                    Sign in to manage your leads, projects,
                    proposals and clients.
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Sign In
                </button>


                <p
                    id="loginMessage"
                    class="login-message"
                ></p>

            </form>

        </section>

    </main>


    <script type="module">

    import { supabase } from "./js/supabase.js";

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const loginMessage = document.getElementById("loginMessage");

    let isSubmitting = false;
    let redirecting = false;

    const SIGN_IN_TIMEOUT_MS = 15000;

    loginForm.addEventListener("submit", async (event) => {

        event.preventDefault();

        // Prevent duplicate submissions.
        if (isSubmitting) return;

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        isSubmitting = true;

        loginButton.disabled = true;
        loginButton.textContent = "Signing In...";
        loginMessage.textContent = "";

        let timeoutId;

        try {

            console.log("[CRM Auth] Starting sign-in request.");

            const signInRequest = supabase.auth.signInWithPassword({
                email,
                password
            });

            // Prevent the interface from waiting forever.
            const timeoutRequest = new Promise((resolve, reject) => {

                timeoutId = window.setTimeout(() => {

                    const error = new Error(
                        "Sign-in timed out after 15 seconds."
                    );

                    error.name = "SignInTimeoutError";

                    reject(error);

                }, SIGN_IN_TIMEOUT_MS);

            });

            const { data, error } = await Promise.race([
                signInRequest,
                timeoutRequest
            ]);

            if (error) {
                throw error;
            }

            if (!data || !data.session) {
                throw new Error(
                    "Authentication returned without an active session. Please try again."
                );
            }

            console.log("[CRM Auth] Authentication succeeded.");

            redirecting = true;

            loginButton.textContent = "Opening Dashboard...";

            window.location.replace("index.html");

        } catch (error) {

            console.error("[CRM Auth] Sign-in failed:", error);

            if (error.name === "SignInTimeoutError") {

                loginMessage.textContent =
                    "Sign-in did not finish within 15 seconds. Refresh this page and try again. If the problem continues, we need to investigate the browser connection.";

            } else {

                loginMessage.textContent =
                    error.message || "Sign-in failed. Please try again.";

            }

        } finally {

            window.clearTimeout(timeoutId);

            if (!redirecting) {

                isSubmitting = false;

                loginButton.disabled = false;
                loginButton.textContent = "Sign In";

            }

        }

    });

</script>

</body>
</html>
